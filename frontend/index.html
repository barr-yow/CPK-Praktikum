<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PesanKita — Manajemen Akun &amp; Kontak</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <!-- Authentication View -->
    <main id="auth-view" class="auth-wrapper">
      <section class="card auth-card" aria-labelledby="auth-heading">
        <div class="brand">
          <div class="brand-badge" aria-hidden="true">PK</div>
          <div>
            <h1 id="auth-heading">PesanKita</h1>
            <p class="subtitle">Simple Messaging App — Manajemen Akun &amp; Kontak</p>
          </div>
        </div>

        <div class="tabs" role="tablist">
          <button id="tab-login" class="tab active" type="button" role="tab" aria-selected="true">Masuk</button>
          <button id="tab-register" class="tab" type="button" role="tab" aria-selected="false">Daftar</button>
        </div>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label for="login-identifier">Email atau Username</label>
            <input id="login-identifier" name="identifier" type="text" autocomplete="username" placeholder="contoh@email.com atau username" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Masuk</button>
        </form>

        <form id="register-form" class="form hidden" novalidate>
          <div class="field">
            <label for="reg-name">Nama Lengkap</label>
            <input id="reg-name" name="name" type="text" autocomplete="name" placeholder="Nama lengkap" required>
          </div>
          <div class="field">
            <label for="reg-username">Username</label>
            <input id="reg-username" name="username" type="text" autocomplete="username" placeholder="huruf, angka, underscore (min. 3)" required>
          </div>
          <div class="field">
            <label for="reg-email">Email</label>
            <input id="reg-email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Buat Akun</button>
        </form>
      </section>
    </main>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="dashboard hidden">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand-inline">
            <span class="brand-badge small" aria-hidden="true">PK</span>
            <strong>PesanKita</strong>
          </div>
          <div class="user-actions">
            <div class="user-meta">
              <span id="user-display-name" class="user-name"></span>
              <span id="user-display-handle" class="user-handle"></span>
            </div>
            <button id="btn-open-delete-account" class="btn btn-danger-outline btn-sm" type="button">Hapus Akun</button>
            <button id="btn-logout" class="btn btn-secondary btn-sm" type="button">Keluar</button>
          </div>
        </div>
      </header>

      <main class="container">
        <section class="panel-header">
          <div>
            <h2>Daftar Kontak</h2>
            <p class="subtitle">Kelola kontak pribadi pada akun Anda.</p>
          </div>
          <div class="toolbar">
            <input id="search-contacts" class="search-input" type="search" placeholder="Cari nama, telepon, atau email...">
            <button id="btn-new-contact" class="btn btn-primary" type="button">+ Tambah Kontak</button>
          </div>
        </section>

        <section id="contacts-container" class="contacts-grid" aria-live="polite"></section>
      </main>
    </div>

    <!-- Contact Create / Edit Modal -->
    <div id="contact-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
      <div class="card modal-card">
        <div class="modal-header">
          <h3 id="contact-modal-title">Tambah Kontak</h3>
          <button id="btn-close-contact-modal" class="icon-btn" type="button" aria-label="Tutup">&times;</button>
        </div>
        <form id="contact-form" class="form" novalidate>
          <input id="contact-id" type="hidden">
          <div class="field">
            <label for="contact-name">Nama Kontak *</label>
            <input id="contact-name" type="text" maxlength="100" placeholder="Contoh: Budi Santoso" required>
          </div>
          <div class="field">
            <label for="contact-phone">Nomor Telepon</label>
            <input id="contact-phone" type="tel" maxlength="30" placeholder="Contoh: +6281234567890">
          </div>
          <div class="field">
            <label for="contact-email">Email</label>
            <input id="contact-email" type="email" maxlength="150" placeholder="Contoh: budi@email.com">
          </div>
          <div class="field">
            <label for="contact-notes">Catatan</label>
            <textarea id="contact-notes" rows="2" maxlength="255" placeholder="Catatan singkat (opsional)"></textarea>
          </div>
          <div class="modal-actions">
            <button id="btn-cancel-contact" class="btn btn-secondary" type="button">Batal</button>
            <button class="btn btn-primary" type="submit">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Account Confirmation Modal -->
    <div id="delete-account-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="delete-account-title">
      <div class="card modal-card">
        <div class="modal-header">
          <h3 id="delete-account-title">Hapus Akun Permanen</h3>
          <button id="btn-close-delete-account" class="icon-btn" type="button" aria-label="Tutup">&times;</button>
        </div>
        <p class="warning-text">Tindakan ini akan menghapus akun Anda beserta seluruh kontak yang tersimpan secara permanen.</p>
        <form id="delete-account-form" class="form" novalidate>
          <div class="field">
            <label for="delete-account-password">Konfirmasi Password</label>
            <input id="delete-account-password" type="password" placeholder="Masukkan password Anda" required>
          </div>
          <div class="modal-actions">
            <button id="btn-cancel-delete-account" class="btn btn-secondary" type="button">Batal</button>
            <button class="btn btn-danger" type="submit">Ya, Hapus Akun</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
